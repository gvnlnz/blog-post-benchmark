# --- Generation ---
# Generation backend, OpenAI-compatible. Now pointed at OpenRouter to benchmark
# frontier cloud models as an upper-bound reference for the local results.
# (For a local Ollama run, set gen_base_url back to http://localhost:11434/v1
#  and remove gen_api_key_env; ollama_host below is only used for RAM reporting.)
gen_base_url: "https://openrouter.ai/api/v1"
gen_api_key_env: "OPENROUTER_API_KEY"
ollama_host: "http://localhost:11434"
temperature: 0.3   # same used in production LLM

# --- Models under test (generators) ---
# NOTE: verify the exact OpenRouter slugs at https://openrouter.ai/models
#       a wrong slug fails fast during warmup.
models:
  - "anthropic/claude-opus-4.8"
  - "google/gemini-3.1-pro-preview"

# --- Dataset ---
# A JSON list of {"items": [{"cluster_topic","article":{title,summary,categories}}]}.
dataset: "data/clusters.json"
output_dir: "results"

# --- Deterministic grammar check (LanguageTool (Java)) ---
grammar: true
grammar_lang: "it"

# --- LLM-as-judge ---
# OpenAI-compatible API. Local judge avoids external billing/quota issues.
# Keep the judge different from the tested models to avoid self-judging.
judge:
  enabled: true
  base_url: "https://openrouter.ai/api/v1"
  model: "meta-llama/llama-3.3-70b-instruct"
  api_key_env: "OPENROUTER_API_KEY"
